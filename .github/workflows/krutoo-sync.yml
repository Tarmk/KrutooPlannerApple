name: Krutoo Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10
    concurrency:
      group: krutoo-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        run: |
          py -3.11 -m pip install --upgrade pip
          py -3.11 -m pip install -r requirements.txt icalendar
      - name: Install Playwright browsers (Windows)
        run: |
          py -3.11 -m playwright install chromium
      - name: Run sync
        env:
          KRUTOO_USERNAME: ${{ secrets.KRUTOO_USERNAME }}
          KRUTOO_PASSWORD: ${{ secrets.KRUTOO_PASSWORD }}
          ICLOUD_USERNAME: ${{ secrets.ICLOUD_USERNAME }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ICLOUD_CALENDAR_NAME: ${{ secrets.ICLOUD_CALENDAR_NAME }}
        run: |
          py -3.11 -c "from sync.main import run_sync; run_sync()"
      - name: Upload artifacts (screens and html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krutoo-debug-artifacts
          path: artifacts
          if-no-files-found: ignore

